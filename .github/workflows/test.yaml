# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test

permissions: read-all

jobs:
  testit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: github::katehayes/dQALY@89cea44e3673f06426b7a38784f421f55dcb71ac
          use-public-rspm: true

      - name: meh
        run: install.packages('pipeline', repos = c('https://timtaylor.r-universe.dev/linux/noble-x86_64/4.6', 'https://cloud.r-project.org'));source('test.R')
        shell: Rscript {0}
